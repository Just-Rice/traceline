<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceline — a fake people-search site (no real data)</title>
  <meta name="description" content="A demonstration of the people-search genre. Every person, address and record is invented in the browser by a random number generator. No real data, no lookups, no network calls.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><circle cx='11.5' cy='11.5' r='5.2' fill='none' stroke='%231f5fbf' stroke-width='2'/><path d='M15.4 15.4L20 20' stroke='%231f5fbf' stroke-width='2' stroke-linecap='round'/></svg>">
</head>
<body>
  <div id="chrome"></div>
  <main id="app"></main>
  <div id="foot"></div>
  <noscript>
    <div class="wrap" style="padding:40px 20px">
      <h1>JavaScript required</h1>
      <p>Traceline is a demonstration site whose people are all invented. It
         builds its entire fictional dataset in the browser, so it needs
         JavaScript enabled.</p>
    </div>
  </noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
